<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracias — Indelible Ads</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B1210;
    --green: #0F6E56;
    --mint: #7BC1A9;
    --wa: #25D366;
    --wa-dim: rgba(37,211,102,0.10);
    --white: #fff;
    --muted: rgba(255,255,255,0.45);
    --border: rgba(255,255,255,0.07);
    --font: "Inter Tight", system-ui, sans-serif;
    --mono: "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--ink);
    color: var(--white);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 7px;
    font-weight: 400;
    font-size: 17px;
    letter-spacing: -0.02em;
    color: var(--white);
    text-decoration: none;
    margin-bottom: 56px;
  }
  .logo img { height: 22px; width: auto; margin-top: -1px; }
  .logo b { font-weight: 800; }
  .check {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--wa-dim);
    border: 1px solid rgba(37,211,102,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 32px;
  }
  h1 {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 16px;
    max-width: 600px;
  }
  h1 em { font-style: italic; color: var(--mint); }
  p {
    font-size: 16px;
    color: var(--muted);
    line-height: 1.7;
    max-width: 480px;
    margin-bottom: 40px;
  }
  .actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 48px;
  }
  .btn-wa {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--wa-dim);
    color: var(--wa);
    border: 1px solid rgba(37,211,102,0.25);
    border-radius: 10px;
    padding: 14px 26px;
    font-size: 15px;
    font-weight: 600;
    font-family: var(--font);
    text-decoration: none;
    transition: all 0.2s;
  }
  .btn-wa:hover { background: rgba(37,211,102,0.18); border-color: rgba(37,211,102,0.4); }
  .btn-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 26px;
    font-size: 15px;
    font-weight: 600;
    font-family: var(--font);
    text-decoration: none;
    transition: all 0.2s;
  }
  .btn-back:hover { color: var(--white); border-color: rgba(255,255,255,0.2); }
  .fine {
    font-family: var(--mono);
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>

<a href="https://indelibleads.com" class="logo">

  Indelible<b>Ads</b>

<div class="check">

</body>
</html>
